name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs reads the version from git history
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Show built version
        run: |
          ls -1 dist/
          python -c "from importlib.metadata import version; print('would-install version:', version('pocketai'))" \
            || true

      - name: Verify built version matches tag
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Extract the version from the wheel filename: pocketai-X.Y.Z-py3-none-any.whl
          wheel=$(ls dist/pocketai-*.whl | head -1)
          pkg_version=$(basename "$wheel" | sed -E 's/^pocketai-([^-]+)-.*/\1/')
          expected_tag="v${pkg_version}"
          echo "wheel=${wheel}  pkg_version=${pkg_version}  ref=${REF}"
          test "${REF}" = "${expected_tag}" \
            || { echo "Tag ${REF} does not match wheel version ${expected_tag}"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, uploading assets."
            gh release upload "${TAG}" dist/*.whl dist/*.tar.gz --clobber
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              dist/*.whl dist/*.tar.gz
          fi
