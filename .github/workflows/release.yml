name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft?"
        required: false
        default: false
        type: boolean

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the commit + tag and create the release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([abrc]?[0-9]+|\.dev[0-9]+|\.post[0-9]+)?$ ]]; then
            echo "Invalid version: $VERSION (expected PEP 440, e.g. 0.2.0)"
            exit 1
          fi

      - name: Bump __version__ in src/pocketai/__init__.py
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("src/pocketai/__init__.py")
          new = re.sub(
              r'(__version__\s*=\s*)"[^"]+"',
              rf'\1"{os.environ["VERSION"]}"',
              path.read_text(),
          )
          path.write_text(new)
          PY
          grep -n "__version__" src/pocketai/__init__.py

      - name: Build to confirm the bump is valid
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls dist/

      - name: Commit, tag, push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pocketai/__init__.py
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=( "v${VERSION}" --title "v${VERSION}" --generate-notes )
          if [[ "${DRAFT}" == "true" ]]; then
            args+=( --draft )
          fi
          gh release create "${args[@]}"
